name: Unity Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write # lets the test runner publish a results check on the commit/PR

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: engine-free logic tests with plain .NET. Seconds, no Unity license.
  logic:
    name: Logic tests (.NET, no Unity)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: dotnet test Tests.Dotnet --logger "trx;LogFileName=logic.trx" --logger "console;verbosity=normal"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logic-test-results
          path: Tests.Dotnet/TestResults

  # Stage 2: the same tests inside the real Unity Editor. Only runs if stage 1 passed.
  editmode:
    name: EditMode tests
    needs: logic
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # Library/ is Unity's import cache; restoring it skips most of the first import.
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-

      - name: Run EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4
        env:
          # Unity 6 Personal: a .ulf is machine-bound, so CI activates online
          # with the Personal serial (extracted from the .ulf) + account login.
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
